name: Commits

# Revisa que todos los commits de un PR sigan la convención `tipo: descripción`.
# Sin esto, el versionado automático (release.yml) no sabe qué versión publicar.
on:
  pull_request:
    branches: [develop, main]

jobs:
  convencion:
    name: Convención de commits
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Se instala de forma global: así npm no resuelve las dependencias de la app (package.json), que no
      # hacen falta aquí y pueden fallar por un paquete roto, y commitlint encuentra config-conventional igual.
      - name: Instalar commitlint
        run: npm install --global --no-audit --no-fund @commitlint/cli@21.2.3 @commitlint/config-conventional@21.2.3

      - name: Revisar los commits del PR
        run: >-
          commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
