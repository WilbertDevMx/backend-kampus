name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Formato y pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kampus_test
          POSTGRES_USER: kampus
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, pdo_pgsql, pdo_sqlite, sqlite3, gd
          coverage: none

      - name: Caché de dependencias de Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Revisar vulnerabilidades conocidas en dependencias
        run: composer audit --no-interaction

      - name: Preparar el entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Revisar formato de código (Pint)
        run: ./vendor/bin/pint --test

      - name: Verificar migraciones contra PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: kampus_test
          DB_USERNAME: kampus
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Ejecutar pruebas
        run: php artisan test
