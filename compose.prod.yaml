# Entorno de pruebas en un solo servidor (T-24): API, WebSocket, cola, tareas programadas y PostgreSQL.
# Uso: docker compose -f compose.prod.yaml --env-file .env.production up -d --build
# Las variables salen de .env.production (copia de .env.production.example que nunca se sube al repo).

x-api: &api
  build: .
  image: kampus-api
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - logs:/var/www/html/storage/logs

services:
  # Entrada pública: HTTPS, PHP-FPM y el WebSocket. Arranca con un certificado autofirmado temporal
  # hasta que certbot saca el de Let's Encrypt (ver el README).
  nginx:
    build: ./docker/nginx
    image: kampus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./public:/var/www/html/public:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app
      - reverb

  # Renueva el certificado de Let's Encrypt cada 12 horas (solo lo cambia cuando le faltan menos de
  # 30 días). El primer certificado se saca a mano con el comando del README.
  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 43200 & wait $${!}; done"]

  # PHP-FPM con la API.
  app:
    <<: *api

  # Cola de trabajos: correos de verificación y recuperación, y broadcasts como match.created.
  queue:
    <<: *api
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]

  # Tareas programadas de Laravel (schedule:work revisa cada minuto).
  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]

  # Servidor de WebSocket (T-13). Solo escucha en la red interna; Nginx lo publica por /app.
  reverb:
    <<: *api
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  logs:
  certbot_conf:
  certbot_www:
