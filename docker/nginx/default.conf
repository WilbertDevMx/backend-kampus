# Entrada pública del entorno de pruebas (T-24). Todo el tráfico va por HTTPS (RNF-02).
# El certificado lo saca y renueva certbot; kampus-certs lo enlaza en /etc/nginx/ssl.

# Cabecera Connection para el WebSocket: "upgrade" si el cliente la pide, "close" si no.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP: solo responde el reto de Let's Encrypt y manda todo lo demás a HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: la API.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html/public;
    index index.php;

    # Igual que post_max_size de PHP (fotos de hasta 5 MB más el resto del formulario).
    client_max_body_size 8m;

    # Si la petición pasa de 8 MB, Nginx la corta antes de llegar a Laravel. Sin esto respondería una página
    # HTML que la app no puede leer; así responde JSON, como el resto de la API. Lleva el origen para que el
    # navegador deje leer el mensaje (la API no usa cookies, así que no expone nada más).
    error_page 413 @too_large;

    location @too_large {
        default_type application/json;
        add_header Access-Control-Allow-Origin $http_origin always;
        return 413 '{"message":"La imagen no puede pesar más de 5 MB."}';
    }

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # WebSocket de Reverb (T-13): la app se conecta a wss://API_DOMAIN/app/{key}. Por /apps llegan
    # los eventos que publica Laravel, aunque Laravel los manda directo a reverb:8080 por la red interna.
    location ~ ^/apps?/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Solo se ejecuta public/index.php; cualquier otro .php responde 404.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# App web (opcional): cuando el frontend genere `expo export`, copia la carpeta `dist` al servidor como
# ./web, monta ./web:/srv/app:ro en el servicio nginx, agrega `-d <dominio de la app>` al comando de
# certbot (el mismo certificado cubre los dos dominios) y quita los comentarios.
