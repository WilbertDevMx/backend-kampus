; PHP en desarrollo local. Mismos límites de subida que producción (fotos de hasta 5 MB).
memory_limit = 512M
upload_max_filesize = 6M
post_max_size = 8M

; Opcache revisa los archivos en cada petición para que los cambios del código se vean al momento.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Guarda más rutas resueltas: menos consultas al disco montado desde Windows.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
